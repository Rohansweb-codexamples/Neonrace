# Dev server config for the Neon Rave static site.
# Mounted read-only over /etc/nginx/nginx.conf by docker-compose.base44.yml,
# so this is the complete main config, not a conf.d snippet.
#
# user root: the sandbox checkout is mode 700 owned by root, so nginx's default
# unprivileged worker user cannot read the bind-mounted files (403 on /).
user root;

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The whole repo is bind-mounted into the web root: never serve dotfiles
        # (.git, .base44, ...).
        location ~ /\. {
            deny all;
        }

        # Dev server: never let the browser cache an edited file.
        add_header Cache-Control "no-store, must-revalidate" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

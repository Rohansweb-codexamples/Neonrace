<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Rave</title><style>*{box-sizing:border-box}body{margin:0;background:#05000d;color:#fff;font-family:Arial;overflow-x:hidden}header{padding:14px 20px;background:#090014;border-bottom:2px solid #f0f;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900;letter-spacing:5px;text-shadow:0 0 10px #0ff,0 0 25px #f0f}button{border:0;border-radius:10px;padding:11px;color:#fff;font-weight:900;background:linear-gradient(135deg,#f08,#5230ff);cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:15px}.hud,.racebox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hud{align-items:center}.score{padding:12px;background:#110a20;border:1px solid #653cff;border-radius:14px}.p1{color:#0ff}.p2{color:#f2d}.status{grid-column:1/-1;text-align:center;font-weight:900}.race{height:410px;position:relative;overflow:hidden;border:2px solid #693cff;border-radius:24px;background:linear-gradient(#080014 0 43%,#18004a 44%,#020207 45%);margin:14px 0;box-shadow:0 0 35px #6c2cff88}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 31px;opacity:.5}.sun{position:absolute;top:35px;left:50%;width:120px;height:120px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#fff,#f3c 45%,#f08);box-shadow:0 0 35px #f0b}.horizon{position:absolute;top:44%;left:0;right:0;height:3px;background:#0ff;box-shadow:0 0 20px #0ff}.grid{position:absolute;left:-20%;right:-20%;bottom:-110px;height:65%;transform:perspective(260px) rotateX(62deg);background-image:linear-gradient(#0eff77 2px,transparent 2px),linear-gradient(90deg,#f0d 2px,transparent 2px);background-size:55px 45px}.track{position:absolute;left:50%;bottom:-5px;width:64%;height:62%;transform:translateX(-50%);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);background:linear-gradient(90deg,#11121e,#29233d,#11121e);border-left:4px solid #0ff;border-right:4px solid #f2d}.finish{position:absolute;top:44%;left:50%;width:28%;height:12px;transform:translate(-50%,-50%);background:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px);z-index:2}.car{position:absolute;bottom:18px;width:58px;height:30px;border-radius:12px;background:#0ff;z-index:4;transition:.6s;box-shadow:0 0 15px #0ff,0 0 30px #0ff}.car:before{content:"";position:absolute;left:10px;right:10px;top:-10px;height:14px;border-radius:8px;background:inherit}.car2{background:#f2d;box-shadow:0 0 15px #f2d,0 0 30px #f2d}.label{position:absolute;top:12px;left:15px;color:#0ff;font-weight:900;letter-spacing:3px}.player{background:#0c0717;border:2px solid #168cff;border-radius:18px;padding:12px}.player.two{border-color:#d329ff}.screen{height:105px;position:relative;overflow:hidden;border-radius:12px;background:#050b18;border:1px solid #0ff;padding:8px}.two .screen{border-color:#f2d}.mini{position:absolute;width:65px;height:28px;border-radius:10px;background:#0ff;left:50%;bottom:15px;transform:translateX(-50%);box-shadow:0 0 18px #0ff}.two .mini{background:#f2d;box-shadow:0 0 18px #f2d}.road{position:absolute;left:30%;right:30%;bottom:-25px;height:65px;transform:perspective(100px) rotateX(55deg);border-left:2px solid #0ff;border-right:2px solid #0ff}.question{text-align:center;font-size:25px;font-weight:900;padding:12px;min-height:55px}.answers,.keyboard{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answers button{background:#101b3a;border:1px solid #168cff}.two .answers button,.two .keyboard button{border-color:#d329ff}.keyboard{grid-template-columns:repeat(4,1fr);margin-top:8px}.keyboard button{padding:9px 3px;background:#111020;border:1px solid #0ff;font-size:12px}.feedback{text-align:center;min-height:25px;font-weight:900;margin-top:8px}.good{color:#43ffad}.bad{color:#ff507d}.modal{display:none;position:fixed;inset:0;background:#020006ee;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#120922;border:2px solid #8b55ff;border-radius:20px;padding:24px;width:min(500px,100%)}@media(max-width:750px){.racebox{grid-template-columns:1fr}.race{height:330px}.track{width:82%}.logo{font-size:20px}}select{background:#08030d;color:white;padding:8px;border:1px solid #7350b0;border-radius:8px}</style>
<header><div class="logo">NEON RAVE</div><button id="set">SETTINGS</button></header><main class="wrap"><div class="hud"><div class="score"><b class="p1">PLAYER 1</b><br><span id="s1">0 / 10</span></div><div class="score"><b class="p2">PLAYER 2</b><br><span id="s2">0 / 10</span></div><div class="status" id="status">BOTH RACERS: GET READY</div></div><div class="race"><div class="stars"></div><div class="sun"></div><div class="horizon"></div><div class="grid"></div><div class="track"></div><div class="finish"></div><div class="label">NEON RAVE CIRCUIT</div><div id="c1" class="car" style="left:29%"></div><div id="c2" class="car car2" style="left:66%"></div></div><div class="racebox">
<section class="player"><div class="screen">CAR 01 / PLAYER 1<div class="road"></div><div class="mini"></div></div><div class="question" id="q1"></div><div class="answers" id="a1"></div><div class="keyboard" id="k1"><button data-v="0">1</button><button data-v="1">2</button><button data-v="2">3</button><button data-v="3">4</button><button data-v="enter">ENTER</button><button data-v="boost">BOOST</button><button data-v="clear">CLEAR</button><button data-v="drive">DRIVE</button></div><div class="feedback" id="f1"></div></section>
<section class="player two"><div class="screen">CAR 02 / PLAYER 2<div class="road"></div><div class="mini"></div></div><div class="question" id="q2"></div><div class="answers" id="a2"></div><div class="keyboard" id="k2"><button data-v="0">1</button><button data-v="1">2</button><button data-v="2">3</button><button data-v="3">4</button><button data-v="enter">ENTER</button><button data-v="boost">BOOST</button><button data-v="clear">CLEAR</button><button data-v="drive">DRIVE</button></div><div class="feedback" id="f2"></div></section></div></main>
<div class="modal" id="settings"><div class="box"><h2>NEON RAVE SETTINGS</h2><p>Challenge mode <select id="mode"><option>Math Race</option></select></p><p>Theme <select id="theme"><option>Neon Rave</option><option>Cyber Space</option><option>Arcade Night</option><option>Neon Nature</option></select></p><button id="close">CLOSE</button></div></div><div class="modal" id="win"><div class="box" style="text-align:center"><h1 id="winner"></h1><p>First car to 10 spaces wins!</p><button id="again">RACE AGAIN</button></div></div>
<script>
const $=id=>document.getElementById(id),Q=[["5 + 3 = ?",["6","7","8","9"],2],["10 - 4 = ?",["4","5","6","7"],2],["2 × 4 = ?",["6","8","10","12"],1],["12 ÷ 3 = ?",["3","4","5","6"],1],["7 + 6 = ?",["11","12","13","14"],2],["15 - 7 = ?",["6","7","8","9"],2],["3 × 5 = ?",["12","15","18","20"],1],["18 ÷ 2 = ?",["7","8","9","10"],2],["9 + 4 = ?",["12","13","14","15"],1],["20 - 9 = ?",["9","10","11","12"],2],["4 × 4 = ?",["12","14","16","18"],2],["21 ÷ 3 = ?",["6","7","8","9"],1]];
let score=[0,0],pick=[null,null],q,locked=false;
function round(){locked=false;pick=[null,null];q=Q[Math.floor(Math.random()*Q.length)];$("status").textContent="SAME QUESTION — FIRST CORRECT RACER GETS THE BOOST";for(let p=0;p<2;p++){ $("q"+(p+1)).textContent=q[0];$("f"+(p+1)).textContent="Choose an answer, then press ENTER or DRIVE";$("f"+(p+1)).className="feedback";let box=$("a"+(p+1));box.innerHTML="";q[1].forEach((v,i)=>{let b=document.createElement("button");b.textContent=v;b.onclick=()=>choose(p,i);box.appendChild(b)})}}
function choose(p,i){if(locked)return;pick[p]=i;[...$("a"+(p+1)).children].forEach((b,n)=>b.style.outline=n==i?"3px solid white":"");$("f"+(p+1)).textContent="ANSWER SELECTED — PRESS ENTER";}
function submit(p){if(locked)return;if(pick[p]===null){$("f"+(p+1)).textContent="SELECT AN ANSWER FIRST";return}if(pick[p]===q[2]){locked=true;score[p]++;render();$("f"+(p+1)).textContent="CORRECT — BOOST!";$("f"+(p+1)).className="feedback good";$("status").textContent="PLAYER "+(p+1)+" WINS THIS ROUND!";if(score[p]>=10){$("winner").textContent="PLAYER "+(p+1)+" WINS!";$("win").classList.add("show");return}setTimeout(round,700)}else{$("f"+(p+1)).textContent="WRONG — TRY AGAIN";$("f"+(p+1)).className="feedback bad";pick[p]=null}}
function render(){$("s1").textContent=score[0]+" / 10";$("s2").textContent=score[1]+" / 10";$("c1").style.left=29+score[0]*3.4+"%";$("c1").style.bottom=18+score[0]*14.5+"px";$("c2").style.left=66-score[1]*3.4+"%";$("c2").style.bottom=18+score[1]*14.5+"px"}
document.querySelectorAll(".keyboard").forEach(k=>{let p=k.id==="k1"?0:1;k.querySelectorAll("button").forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v<4)choose(p,+v);else if(v==="clear"){pick[p]=null;round()}else submit(p)})});
$("set").onclick=()=>$("settings").classList.add("show");$("close").onclick=()=>$("settings").classList.remove("show");$("again").onclick=()=>{score=[0,0];$("win").classList.remove("show");render();round()};$("theme").onchange=e=>document.body.style.background=e.target.value==="Cyber Space"?"#020817":e.target.value==="Arcade Night"?"#180018":e.target.value==="Neon Nature"?"#001c16":"#05000d";render();round();
</script>

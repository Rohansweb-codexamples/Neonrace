<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Neon Rave</title><style>body{margin:0;font-family:Arial;background:linear-gradient(45deg,#ff00ff,#00ffff,#ff8800);background-size:400% 400%;animation:bg 10s infinite;color:#fff;text-align:center} @keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}} .track{height:30px;background:#111;border-radius:20px;margin:10px}.fill{height:100%;width:0;background:#00ffff;border-radius:20px}.fill2{background:#ff00ff}.card{background:rgba(0,0,0,.4);margin:20px;padding:20px;border-radius:20px}</style></head><body><h1>NEON RAVE</h1><div class='card'><h2 id='turn'>Player 1 Turn</h2><p id='challenge'></p><button onclick='completeChallenge()'>Completed</button></div><div>Player 1<div class='track'><div id='p1' class='fill'></div></div></div><div>Player 2<div class='track'><div id='p2' class='fill fill2'></div></div></div><h2 id='winner'></h2><script>let p1=0,p2=0,player=1;const c=['5+3=?','2+7=?','Draw a star','Draw a house','Hop 5 times','Name 3 animals','4+4=?','Draw a smiley'];function next(){challenge.innerText=c[Math.floor(Math.random()*c.length)]}function completeChallenge(){if(player===1){p1+=10;p1.styleWidth;document.getElementById('p1').style.width=p1+'%';if(p1>=100)return win(1);player=2}else{p2+=10;document.getElementById('p2').style.width=p2+'%';if(p2>=100)return win(2);player=1}turn.innerText='Player '+player+' Turn';next()}function win(n){winner.innerText='PLAYER '+n+' WINS THE NEON RAVE!'}next()</script></body></html>

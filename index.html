<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Rave</title><style>
*{box-sizing:border-box}body{margin:0;background:#05000d;color:white;font-family:Arial;overflow-x:hidden}header{height:68px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:#080013;border-bottom:2px solid #f0c}.logo{font-size:28px;font-weight:900;letter-spacing:5px;text-shadow:0 0 10px #0ff,0 0 25px #f0f}button{border:0;border-radius:12px;padding:12px 18px;color:#fff;font-weight:900;background:linear-gradient(135deg,#f08,#5230ff);cursor:pointer;box-shadow:0 0 15px #f08a}.wrap{max-width:1200px;margin:auto;padding:18px}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.p{background:#110a20;border:1px solid #5536ff;border-radius:14px;padding:12px}.p2{text-align:right}.cyan{color:#0ff}.pink{color:#f3d}.turn{text-align:center;font-weight:900}.race{height:440px;position:relative;overflow:hidden;margin-top:15px;border-radius:24px;background:linear-gradient(#090019,#190047 43%,#020207 44%);border:2px solid #673cff;box-shadow:0 0 35px #6c2cff88}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 31px;opacity:.45}.sun{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:125px;height:125px;border-radius:50%;background:linear-gradient(#fff,#f3c 40%,#f08);box-shadow:0 0 35px #f0b}.horizon{position:absolute;top:44%;left:0;right:0;height:3px;background:#0ff;box-shadow:0 0 20px #0ff}.grid{position:absolute;left:-20%;right:-20%;bottom:-100px;height:65%;transform:perspective(260px) rotateX(62deg);background-image:linear-gradient(#0eff77 2px,transparent 2px),linear-gradient(90deg,#f0d 2px,transparent 2px);background-size:55px 45px}.track{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);width:64%;height:62%;clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);background:linear-gradient(90deg,#11121e,#252238,#11121e);border-left:4px solid #0ff;border-right:4px solid #f0d}.finish{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:28%;height:12px;background:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px);z-index:3;box-shadow:0 0 15px #fff}.car{position:absolute;bottom:18px;width:55px;height:30px;border-radius:12px;background:#0ff;z-index:5;transition:.6s;box-shadow:0 0 12px #0ff,0 0 30px #0ff}.car:before{content:"";position:absolute;left:10px;right:10px;top:-11px;height:15px;border-radius:8px;background:inherit}.car2{background:#f2d;box-shadow:0 0 12px #f2d,0 0 30px #f2d}.label{position:absolute;top:12px;left:15px;font-weight:900;letter-spacing:3px;color:#0ff}.challenge{margin-top:16px;padding:20px;background:#0d0718;border:1px solid #693cff;border-radius:20px}.head{display:flex;justify-content:space-between}.tag{background:#25105b;padding:7px 12px;border-radius:99px;font-weight:900}.question{text-align:center;font-size:30px;font-weight:900;padding:20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:700px;margin:auto}.feedback{text-align:center;min-height:25px;font-weight:900}.good{color:#43ffad}.bad{color:#ff507d}.draw{display:none;max-width:750px;margin:auto}.draw canvas{display:block;width:100%;height:280px;background:#fff;border-radius:15px;touch-action:none}.tools{display:flex;justify-content:center;gap:10px;margin-top:10px}.settings,.win{display:none;position:fixed;inset:0;background:#020006ee;z-index:50;align-items:center;justify-content:center;padding:20px}.show{display:flex}.box{background:#120922;border:2px solid #8b55ff;border-radius:22px;padding:25px;width:min(500px,100%)}.setting{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #332447}select{background:#08030d;color:#fff;padding:8px;border:1px solid #7350b0;border-radius:8px}@media(max-width:700px){.hud{grid-template-columns:1fr 1fr}.turn{grid-column:1/-1;grid-row:1}.race{height:340px}.track{width:82%}.answers{grid-template-columns:1fr}.question{font-size:23px}.logo{font-size:20px}}
</style></head><body><header><div class="logo">NEON RAVE</div><button id="set">SETTINGS</button></header><main class="wrap"><div class="hud"><div class="p"><b class="cyan">PLAYER 1</b><br><span id="s1">0 / 10</span></div><div class="turn" id="turn">PLAYER 1'S TURN</div><div class="p p2"><b class="pink">PLAYER 2</b><br><span id="s2">0 / 10</span></div></div><div class="race"><div class="stars"></div><div class="sun"></div><div class="horizon"></div><div class="grid"></div><div class="track"></div><div class="finish"></div><div class="label">NEON RAVE CIRCUIT</div><div id="c1" class="car" style="left:29%"></div><div id="c2" class="car car2" style="left:66%"></div></div><section class="challenge"><div class="head"><span class="tag" id="tag">MATH CHALLENGE</span><span id="round">ROUND 1</span></div><div class="question" id="q"></div><div class="answers" id="answers"></div><div class="draw" id="draw"><p id="drawText"></p><canvas id="canvas" width="900" height="420"></canvas><div class="tools"><button id="clear">CLEAR</button><button id="submit">SUBMIT DRAWING</button></div></div><div class="feedback" id="fb"></div></section></main><div class="settings" id="settings"><div class="box"><h2>NEON RAVE SETTINGS</h2><div class="setting">Challenge mix <select id="mix"><option value="mixed">Math + Drawing</option><option value="math">Math only</option><option value="draw">Drawing only</option></select></div><div class="setting">Theme <select id="theme"><option>Neon Rave</option><option>Cyber Space</option><option>Arcade Night</option><option>Neon Nature</option></select></div><br><button id="close">CLOSE</button></div></div><div class="win" id="win"><div class="box" style="text-align:center"><h1 id="winner"></h1><p>First racer to reach 10 spaces wins!</p><button id="again">RACE AGAIN</button></div></div><script>
const $=id=>document.getElementById(id);let score=[0,0],turn=0,round=1,locked=false;const math=[["5 + 3 = ?",["6","7","8","9"],"8"],["10 - 4 = ?",["4","5","6","7"],"6"],["2 × 4 = ?",["6","8","10","12"],"8"],["12 ÷ 3 = ?",["3","4","5","6"],"4"],["7 + 6 = ?",["11","12","13","14"],"13"],["15 - 7 = ?",["6","7","8","9"],"8"],["3 × 5 = ?",["12","15","18","20"],"15"],["18 ÷ 2 = ?",["7","8","9","10"],"9"],["9 + 4 = ?",["12","13","14","15"],"13"],["20 - 9 = ?",["9","10","11","12"],"11"],["4 × 4 = ?",["12","14","16","18"],"16"],["21 ÷ 3 = ?",["6","7","8","9"],"7"]];const pics=["A STAR","A ROCKET","A HAPPY ROBOT","A HOUSE","A LIGHTNING BOLT","A DANCING ALIEN","A PLANET WITH RINGS","SUNGLASSES"];
function next(){let m=$("mix").value;let type=m==="math"?"math":m==="draw"?"draw":Math.random()<.6?"math":"draw";type==="math"?showMath():showDraw()}
function showMath(){locked=false;$("tag").textContent="MATH CHALLENGE";$("draw").style.display="none";$("answers").style.display="grid";let a=math[Math.floor(Math.random()*math.length)];$("q").textContent=a[0];$("answers").innerHTML="";a[1].forEach(v=>{let b=document.createElement("button");b.textContent=v;b.onclick=()=>answer(v===a[2]);$("answers").appendChild(b)});$("fb").textContent="Choose the correct answer to move forward.";$("fb").className="feedback";$("round").textContent="ROUND "+round}
function showDraw(){locked=false;$("tag").textContent="DRAWING CHALLENGE";$("answers").style.display="none";$("q").textContent="";$("draw").style.display="block";$("drawText").textContent="DRAW "+pics[Math.floor(Math.random()*pics.length)]+" IN THE SPACE BELOW";clearCanvas();$("fb").textContent="Draw it, then press SUBMIT DRAWING to move forward.";$("fb").className="feedback";$("round").textContent="ROUND "+round}
function answer(ok){if(locked)return;locked=true;document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);if(ok){$("fb").textContent="CORRECT! RACER MOVES FORWARD";$("fb").className="feedback good";move()}else{$("fb").textContent="WRONG — NO MOVE";$("fb").className="feedback bad";setTimeout(nextTurn,800)}}
function move(){score[turn]++;render();if(score[turn]>=10){$("winner").textContent="PLAYER "+(turn+1)+" WINS!";$("win").classList.add("show");return}setTimeout(nextTurn,650)}
function nextTurn(){turn=1-turn;round++;$("turn").textContent="PLAYER "+(turn+1)+"'S TURN";next()}
function render(){$("s1").textContent=score[0]+" / 10";$("s2").textContent=score[1]+" / 10";let a=score[0]/10,b=score[1]/10;$("c1").style.left=(29+a*34)+"%";$("c1").style.bottom=(18+a*145)+"px";$("c2").style.left=(66-b*34)+"%";$("c2").style.bottom=(18+b*145)+"px"}
const canvas=$("canvas"),ctx=canvas.getContext("2d");let pen=false,last;function clearCanvas(){ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height)}function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.onpointerdown=e=>{pen=true;last=pos(e)};canvas.onpointermove=e=>{if(!pen)return;let p=pos(e);ctx.strokeStyle="#111";ctx.lineWidth=10;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};window.onpointerup=()=>pen=false;$("clear").onclick=clearCanvas;$("submit").onclick=()=>{if(locked)return;locked=true;$("fb").textContent="DRAWING ACCEPTED! RACER MOVES FORWARD";$("fb").className="feedback good";move()};
$("set").onclick=()=>$("settings").classList.add("show");$("close").onclick=()=>$("settings").classList.remove("show");$("theme").onchange=e=>{let v=e.target.value;document.body.style.background=v==="Cyber Space"?"#020817":v==="Arcade Night"?"#180018":v==="Neon Nature"?"#001c16":"#05000d"};$("again").onclick=()=>{score=[0,0];turn=0;round=1;$("win").classList.remove("show");$("turn").textContent="PLAYER 1'S TURN";render();next()};clearCanvas();render();next();
</script></body></html>
